<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI-Powered Cybersecurity</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Cyber Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, rgba(6, 182, 212, 0.05) 0%, var(--bg-main) 70%);
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-cyan), transparent);
            animation: scanline 3s linear infinite;
        }
        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-brand i {
            font-size: 2.5rem;
            color: var(--color-cyan);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--color-cyan-glow));
            animation: pulseshield 2.5s infinite alternate;
        }
        .login-brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: 1px;
        }
        .login-brand span {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }
        .form-group i.input-icon {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: var(--text-muted);
        }
        .cyber-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
        }
        .toggle-password {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: var(--color-cyan);
        }
        .btn-login {
            width: 100%;
            justify-content: center;
            margin-top: 10px;
            padding: 14px;
        }
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--color-crimson);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <h1>AEGIS SECURITY</h1>
                <span>AI Fraud Engine</span>
            </div>
            
            {% if error %}
            <div class="error-message">
                <i class="fa-solid fa-triangle-exclamation"></i>
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" id="loginForm">
                <div class="form-group">
                    <label for="username">Operator ID</label>
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" name="username" class="cyber-input" placeholder="Enter your ID" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Access Code</label>
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="cyber-input" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
                
                <button type="submit" class="btn-cyber btn-login" id="submitBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Initialize Session
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
